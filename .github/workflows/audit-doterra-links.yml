name: Audit doTERRA Links

on:
  # Run on push to main
  push:
    branches: [main]
    paths:
      - 'verifiedSlugs.json'
      - 'audit_doterra_links.py'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run weekly on Sundays at midnight
  schedule:
    - cron: '0 0 * * 0'

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run doTERRA link audit
        id: audit
        run: |
          python audit_doterra_links.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Upload failing slugs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failing-doterra-slugs-${{ github.sha }}
          path: failing_doterra_slugs.json
          if-no-files-found: ignore
      
      - name: Comment on commit (if failures found)
        if: steps.audit.outputs.exit_code != '0' && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('failing_doterra_slugs.json')) {
              const failures = JSON.parse(fs.readFileSync('failing_doterra_slugs.json', 'utf8'));
              const count = failures.length;
              const list = failures.slice(0, 5).map(f => `- **${f.key}** (${f.slug}): ${f.reason}`).join('\n');
              const more = count > 5 ? `\n\n...and ${count - 5} more. Check the artifact for full list.` : '';
              
              github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `⚠️ **doTERRA Link Audit Found ${count} Failing Slug(s)**\n\n${list}${more}\n\nDownload the full report from the Actions artifacts.`
              });
            }
